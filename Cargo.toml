[package]
name = "coords_hud"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# SDK oficial do Horizon, fixado na revisão imediatamente anterior à remoção
# do runtime WebAssembly. Não foi publicado no crates.io.
horizon-mod-sdk = { git = "https://github.com/horizon-rust/horizon", rev = "e7614d2197ebe9ffdaa75e1bbb432dc0ce855e70" }

[profile.release]
opt-level = "s"
lto = true
strip = true
